<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>健康麻雀 参加者確認</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}
body {
  font-family: "Hiragino Kaku Gothic Pro", "メイリオ", sans-serif;
  background: linear-gradient(160deg, #e3f2fd 0%, #ffffff 60%);
}
.container {
  width: 100%;
  min-height: 100vh;
  background: #fff;
  box-shadow: 0 0 20px rgba(0,0,0,0.08);
}

/* タイトル */
header {
  background: linear-gradient(120deg, #1565c0, #1e88e5);
  color: #fff;
  padding: 28px;
  text-align: center;
  font-size: 50px;
  font-weight: bold;
  letter-spacing: 2px;
}

.calendar {
  padding: 24px 22px;
}

.month-title {
  font-size: 50px;
  margin-bottom: 16px;
  font-weight: bold;
  text-align: center;
  color: #0d47a1;
}

.week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 40px;
}

.week div:first-child {
  color: #c62828;
}
.week div:last-child {
  color: #1565c0;
}

.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 14px;
  margin-top: 14px;
}

.day {
  padding: 26px 0;
  border-radius: 16px;
  background: linear-gradient(180deg, #e3f2fd, #bbdefb);
  cursor: pointer;
  font-size: 40px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  transition: transform 0.1s;
}

.day:active {
  transform: scale(0.96);
}

.day.disabled {
  background: #f0f0f0;
  color: #aaa;
  cursor: not-allowed;
  box-shadow: none;
}

.day.selected {
  background: linear-gradient(120deg, #0d47a1, #1976d2);
  color: #fff;
}

.selected-box {
  padding: 24px 22px;
  border-top: 2px dashed #bbdefb;
  background: #f7fbff;
}

.selected-box h3 {
  margin: 0 0 16px 0;
  font-size: 40px;
  color: #0d47a1;
}

.participant {
  font-size: 40px;
  margin: 8px 0;
}
/* 満卓の可能性がある場合の警告 */
.full-warning {
  display: none;
  margin-bottom: 20px;
  padding: 22px;
  border: 4px solid #d32f2f;
  border-radius: 16px;
  background: #ffebee;
  color: #b71c1c;
  font-size: 38px;
  font-weight: bold;
  text-align: center;
}

/* 選択した日付の表示 */
.selected-date {
  margin-bottom: 16px;
  color: #1565c0;
  font-size: 34px;
  font-weight: bold;
}

/* 読み込み中・エラー */
.status-message {
  font-size: 34px;
  color: #555;
}
/* 月ごとのカレンダー */
.month-block {
  margin-bottom: 42px;
}

.month-block:last-child {
  margin-bottom: 0;
}
/* イベント開催日 */
.day.event-day {
  background: linear-gradient(180deg, #fff3e0, #ffcc80);
  border: 4px solid #fb8c00;
  color: #bf360c;
  padding: 12px 3px;
  min-height: 100px;
}

/* 日付の数字 */
.day-number {
  display: block;
  font-size: 40px;
  font-weight: bold;
}

/* カレンダー内のイベント名 */
.event-label {
  display: -webkit-box;
  margin-top: 4px;
  padding: 0 2px;
  overflow: hidden;
  color: #bf360c;
  font-size: 18px;
  font-weight: bold;
  line-height: 1.15;
  overflow-wrap: anywhere;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

/* イベント日を選択した場合は濃い青を優先 */
.day.event-day.selected {
  background: linear-gradient(120deg, #0d47a1, #1976d2);
  border-color: #0d47a1;
  color: #fff;
}

.day.event-day.selected .event-label {
  color: #fff;
}
</style>
</head>
<body>

<div class="container">
<header>参加者確認</header>

<div class="calendar">
  <div id="calendarMonths"></div>
</div>

<div class="selected-box">
  <h3>参加者一覧</h3>

  <div id="selectedDate" class="selected-date">
    確認する日付を選択してください
  </div>

  <div id="fullWarning" class="full-warning">
    ⚠ この日は満卓の可能性があります
  </div>

  <div id="participantList"></div>
</div>

<script>
const today = new Date();

const calendarMonths =
  document.getElementById("calendarMonths");

const listBox =
  document.getElementById("participantList");

const selectedDateBox =
  document.getElementById("selectedDate");

const fullWarning =
  document.getElementById("fullWarning");

let selectedDate = "";
/*
  開催日をキーにしてイベント情報を保存する。
  例：
  eventMap["2026-09-15"] = "健康麻雀大会"
*/
let eventMap = {};

/*
  Dateを日本時間のままYYYY-MM-DD形式に変換する。
  toISOString()による日付ずれを防ぐ。
*/
function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;
}

/*
  YYYY-MM-DDを画面表示用の日付に変換する。
*/
function formatDisplayDate(dateText) {
  const [y, m, d] = dateText.split("-");

  return `${Number(m)}月${Number(d)}日`;
}


/*
  当月と翌月のイベント情報を取得する。
*/
async function loadEvents() {
  const monthValues = [];

  for (let monthOffset = 0; monthOffset < 2; monthOffset++) {
    const displayedMonth = new Date(
      today.getFullYear(),
      today.getMonth() + monthOffset,
      1
    );

    const year = displayedMonth.getFullYear();
    const month = String(
      displayedMonth.getMonth() + 1
    ).padStart(2, "0");

    monthValues.push(`${year}-${month}`);
  }

  try {
    const responses = await Promise.all(
      monthValues.map(monthValue =>
        fetch(`/api/events?month=${monthValue}`)
      )
    );

    const results = await Promise.all(
      responses.map(response => response.json())
    );

    eventMap = {};

    results.forEach(result => {
      if (result.status !== "ok") {
        return;
      }

      result.events.forEach(eventData => {
        eventMap[eventData.event_date] =
          eventData.event_name;
      });
    });

  } catch (error) {
    console.error(
      "イベント情報を取得できませんでした。",
      error
    );
  }
}


/*
  当月と翌月のカレンダーを表示する。
*/
function render() {
  calendarMonths.innerHTML = "";

  const startOfToday = new Date(
    today.getFullYear(),
    today.getMonth(),
    today.getDate()
  );

  /*
    0は当月、1は翌月。
  */
  for (let monthOffset = 0; monthOffset < 2; monthOffset++) {
    const displayedMonth = new Date(
      today.getFullYear(),
      today.getMonth() + monthOffset,
      1
    );

    const year = displayedMonth.getFullYear();
    const month = displayedMonth.getMonth();

    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);

    /*
      月全体を入れる場所。
    */
    const monthBlock = document.createElement("div");
    monthBlock.className = "month-block";

    /*
      月タイトル。
    */
    const monthTitle = document.createElement("div");
    monthTitle.className = "month-title";
    monthTitle.innerText = `${year}年${month + 1}月`;

    monthBlock.appendChild(monthTitle);

    /*
      曜日の表示。
    */
    const weekBox = document.createElement("div");
    weekBox.className = "week";

    const weekNames = [
      "日", "月", "火", "水", "木", "金", "土"
    ];

    weekNames.forEach(weekName => {
      const weekDay = document.createElement("div");
      weekDay.innerText = weekName;
      weekBox.appendChild(weekDay);
    });

    monthBlock.appendChild(weekBox);

    /*
      日付を入れる場所。
    */
    const daysBox = document.createElement("div");
    daysBox.className = "days";

    /*
      月初より前の空欄。
    */
    for (let i = 0; i < first.getDay(); i++) {
      const blank = document.createElement("div");
      daysBox.appendChild(blank);
    }

    /*
      その月の日付を作成する。
    */
    for (let d = 1; d <= last.getDate(); d++) {
      const date = new Date(year, month, d);
      const key = formatDate(date);

      const div = document.createElement("div");
      div.className = "day";

      /*
        日付の数字を作る。
      */
      const dayNumber = document.createElement("span");
      dayNumber.className = "day-number";
      dayNumber.innerText = d;

      div.appendChild(dayNumber);

      /*
        イベントが登録されている場合は、
        背景色を変えてイベント名を表示する。
      */
      if (eventMap[key]) {
        div.classList.add("event-day");

        const eventLabel = document.createElement("span");
        eventLabel.className = "event-label";
        eventLabel.innerText = eventMap[key];

        div.appendChild(eventLabel);
      }

      const isPast = date < startOfToday;
      const isWednesday = date.getDay() === 3;
      const isSunday = date.getDay() === 0;

      /*
        参加申し込み画面と同じ条件。
        過去・水曜日・日曜日は選択不可。
      */
      if (isPast || isWednesday || isSunday) {
        div.classList.add("disabled");
      } else {
        div.onclick = () => loadParticipants(key);
      }

      /*
        選択中の日を濃い青色にする。
      */
      if (key === selectedDate) {
        div.classList.add("selected");
      }

      daysBox.appendChild(div);
    }

    monthBlock.appendChild(daysBox);
    calendarMonths.appendChild(monthBlock);
  }
}
/*
  選択日の参加者一覧と参加人数を取得する。
*/
async function loadParticipants(date) {
  selectedDate = date;

/*
  イベント情報を取得してからカレンダーを表示する。
*/
async function initializeCalendar() {
  await loadEvents();
  render();
}

initializeCalendar();

  selectedDateBox.innerText =
    `${formatDisplayDate(date)}の参加者`;

  listBox.innerHTML =
    "<div class='status-message'>読み込み中...</div>";

  /*
    前に表示した警告をいったん消す。
  */
  fullWarning.style.display = "none";

  try {
    /*
      参加者一覧と参加人数を同時に取得する。
    */
    const [listResponse, countResponse] = await Promise.all([
      fetch(`/list?date=${encodeURIComponent(date)}`),
      fetch(`/participant-count?date=${encodeURIComponent(date)}`)
    ]);

    const users = await listResponse.json();
    const countResult = await countResponse.json();

    if (!listResponse.ok) {
      throw new Error(
        users.message || "参加者一覧を取得できませんでした。"
      );
    }

    if (!countResponse.ok) {
      throw new Error(
        countResult.message || "参加人数を取得できませんでした。"
      );
    }

    listBox.innerHTML = "";

    /*
      33名以上の場合だけ警告を表示する。
    */
    if (countResult.show_warning) {
      fullWarning.style.display = "block";
    }

    if (users.length === 0) {
      listBox.innerHTML =
        "<div class='participant'>参加者なし</div>";
      return;
    }

    /*
      参加者名を順番に表示する。
    */
    users.forEach((name, index) => {
      const div = document.createElement("div");
      div.className = "participant";
      div.innerText = `${index + 1}. ${name}`;

      listBox.appendChild(div);
    });

  } catch (error) {
    console.error(error);

    fullWarning.style.display = "none";

    listBox.innerHTML =
      `<div class="participant">${error.message}</div>`;
  }
}

render();
</script>

</body>
</html>
